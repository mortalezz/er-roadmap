[project]
name = "er-ngplus-compiler"
version = "0.1.0"
description = "Demand-driven geographical route & Point-of-No-Return (PONR) DAG compiler for Elden Ring & Shadow of the Erdtree"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.159.1",
]

[tool.setuptools]
py-modules = ["main", "compiler", "seed_db", "populate_full_db"]
