[package]
name = "er-roadmap-gpu"
version = "0.1.0"
edition = "2021"
description = "100% Pure-Rust Metal GPU Immediate-Mode GUI (egui/eframe) — Zero HTML, Zero CSS, Zero JS, Zero WebView"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3
